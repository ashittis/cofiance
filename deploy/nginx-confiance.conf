# Nginx reverse proxy for Confiance Services (single EC2 box).
# Install:
#   sudo cp ~/cofiance/deploy/nginx-confiance.conf /etc/nginx/sites-available/confiance
#   sudo ln -s /etc/nginx/sites-available/confiance /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
# Then run certbot (adds the 443 blocks + HTTP->HTTPS redirect automatically):
#   sudo certbot --nginx -d confianceservices.in -d www.confianceservices.in -d api.confianceservices.in

# --- Website (Next.js on :3000) ---
server {
    listen 80;
    server_name confianceservices.in www.confianceservices.in;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# --- API (FastAPI on :8000) ---
server {
    listen 80;
    server_name api.confianceservices.in;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
